<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para el amor de mi vida</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #fdf0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Lato', sans-serif;
    overflow: hidden;
    position: relative;
  }

  .hearts-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .floating-heart {
    position: absolute;
    top: -60px;
    font-size: 20px;
    animation: fall linear infinite;
    opacity: 0;
    user-select: none;
  }

  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg) scale(0.8);  opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(110vh) rotate(360deg) scale(1.2); opacity: 0; }
  }

  .card {
    background: #FDF6EC;
    border-radius: 24px;
    padding: 2.5rem 2rem 2rem;
    max-width: 460px;
    width: 90%;
    border: 1px solid #e8d5b8;
    position: relative;
    z-index: 1;
    box-shadow: 0 8px 40px rgba(180, 100, 60, 0.12);
    animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  #tree-svg {
    float: right;
    width: 155px;
    height: 148px;
    margin: -0.5rem -0.3rem 0.5rem 1rem;
  }

  .tree-heart {
    opacity: 0;
    transform-origin: center;
    animation: heartBloom 0.4s ease-out forwards;
  }

  @keyframes heartBloom {
    0%   { opacity: 0; transform: scale(0) rotate(-20deg); }
    70%  { transform: scale(1.15) rotate(5deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .trunk {
    opacity: 0;
    animation: trunkGrow 0.5s ease-out 0.1s forwards;
    transform-origin: bottom center;
  }

  @keyframes trunkGrow {
    from { opacity: 0; transform: scaleY(0); }
    to   { opacity: 1; transform: scaleY(1); }
  }

  .title {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-style: italic;
    color: #5C4033;
    margin-bottom: 0.6rem;
    opacity: 0;
    animation: fadeIn 0.6s ease 1.8s forwards;
  }

  .message {
    font-size: 14px;
    color: #7a5c4a;
    line-height: 1.8;
    margin-bottom: 1rem;
    min-height: 100px;
  }

  .typewriter-line {
    display: block;
    overflow: hidden;
    white-space: nowrap;
    width: 0;
    opacity: 1;
  }

  .tw1 { animation: typing 1.4s steps(40) 2.2s forwards; }
  .tw2 { animation: typing 1.6s steps(44) 3.8s forwards; }
  .tw3 { animation: typing 0.8s steps(20) 5.6s forwards; font-style: italic; color: #9e7a6a; font-size: 13px; }

  @keyframes typing {
    from { width: 0; }
    to   { width: 100%; }
  }

  @keyframes nickIn {
    0%   { opacity: 0; transform: translateY(-6px) scale(0.85); }
    60%  { transform: translateY(2px) scale(1.08); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes nickOut {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(6px) scale(0.85); }
  }
  .nick-in  { animation: nickIn  0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
  .nick-out { animation: nickOut 0.3s ease-in forwards; }

  .divider {
    border: none;
    border-top: 1px solid #e0c8b0;
    margin: 1rem 0 0.75rem;
    opacity: 0;
    animation: fadeIn 0.5s ease 9.2s forwards;
  }

  .counter-label {
    font-size: 12px;
    color: #9e7a6a;
    font-style: italic;
    margin-bottom: 4px;
    opacity: 0;
    animation: fadeIn 0.5s ease 9.4s forwards;
  }

  .counter {
    font-size: 15px;
    color: #5C4033;
    opacity: 0;
    animation: fadeIn 0.5s ease 9.6s forwards;
  }

  .counter .num {
    font-weight: 700;
    font-size: 17px;
    color: #c0674a;
    display: inline-block;
  }

  .counter .num.pulse {
    animation: pulse 0.3s ease;
  }

  @keyframes pulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.25); color: #e05030; }
    100% { transform: scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="hearts-container" id="hearts"></div>

<div class="card">

  <svg id="tree-svg" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
    <rect class="trunk" x="93" y="145" width="14" height="38" rx="5" fill="#8B5E3C"/>
    <ellipse cx="100" cy="183" rx="28" ry="4.5" fill="#a0724a" opacity="0.35" style="opacity:0;animation:fadeIn 0.4s ease 0.4s forwards"/>
    <path class="tree-heart" style="animation-delay:0.6s"  d="M60,128 C60,122 52,116 52,122 C52,116 44,122 44,128 C44,134 52,140 52,140 Z" fill="#e05a7a"/>
    <path class="tree-heart" style="animation-delay:0.7s"  d="M78,122 C78,116 70,110 70,116 C70,110 62,116 62,122 C62,128 70,134 70,134 Z" fill="#d4406a"/>
    <path class="tree-heart" style="animation-delay:0.75s" d="M96,126 C96,120 88,114 88,120 C88,114 80,120 80,126 C80,132 88,138 88,138 Z" fill="#f06090"/>
    <path class="tree-heart" style="animation-delay:0.8s"  d="M114,120 C114,114 106,108 106,114 C106,108 98,114 98,120 C98,126 106,132 106,132 Z" fill="#e84a72"/>
    <path class="tree-heart" style="animation-delay:0.85s" d="M132,124 C132,118 124,112 124,118 C124,112 116,118 116,124 C116,130 124,136 124,136 Z" fill="#c93060"/>
    <path class="tree-heart" style="animation-delay:0.9s"  d="M150,128 C150,122 142,116 142,122 C142,116 134,122 134,128 C134,134 142,140 142,140 Z" fill="#f07090"/>
    <path class="tree-heart" style="animation-delay:1.0s"  d="M68,104 C68,98 60,92 60,98 C60,92 52,98 52,104 C52,110 60,116 60,116 Z" fill="#f08050"/>
    <path class="tree-heart" style="animation-delay:1.05s" d="M86,98 C86,92 78,86 78,92 C78,86 70,92 70,98 C70,104 78,110 78,110 Z" fill="#e84a72"/>
    <path class="tree-heart" style="animation-delay:1.1s"  d="M104,96 C104,90 96,84 96,90 C96,84 88,90 88,96 C88,102 96,108 96,108 Z" fill="#c83058"/>
    <path class="tree-heart" style="animation-delay:1.15s" d="M122,98 C122,92 114,86 114,92 C114,86 106,92 106,98 C106,104 114,110 114,110 Z" fill="#f06090"/>
    <path class="tree-heart" style="animation-delay:1.2s"  d="M140,104 C140,98 132,92 132,98 C132,92 124,98 124,104 C124,110 132,116 132,116 Z" fill="#e05070"/>
    <path class="tree-heart" style="animation-delay:1.3s"  d="M76,80 C76,74 68,68 68,74 C68,68 60,74 60,80 C60,86 68,92 68,92 Z" fill="#f0a040"/>
    <path class="tree-heart" style="animation-delay:1.35s" d="M94,74 C94,68 86,62 86,68 C86,62 78,68 78,74 C78,80 86,86 86,86 Z" fill="#e05080"/>
    <path class="tree-heart" style="animation-delay:1.4s"  d="M112,74 C112,68 104,62 104,68 C104,62 96,68 96,74 C96,80 104,86 104,86 Z" fill="#d04070"/>
    <path class="tree-heart" style="animation-delay:1.45s" d="M130,80 C130,74 122,68 122,74 C122,68 114,74 114,80 C114,86 122,92 122,92 Z" fill="#f07050"/>
    <path class="tree-heart" style="animation-delay:1.55s" d="M86,56 C86,50 78,44 78,50 C78,44 70,50 70,56 C70,62 78,68 78,68 Z" fill="#e84060"/>
    <path class="tree-heart" style="animation-delay:1.6s"  d="M104,50 C104,44 96,38 96,44 C96,38 88,44 88,50 C88,56 96,62 96,62 Z" fill="#c03060"/>
    <path class="tree-heart" style="animation-delay:1.65s" d="M122,56 C122,50 114,44 114,50 C114,44 106,50 106,56 C106,62 114,68 114,68 Z" fill="#f06080"/>
    <path class="tree-heart" style="animation-delay:1.75s" d="M104,30 C104,24 96,18 96,24 C96,18 88,24 88,30 C88,36 96,42 96,42 Z" fill="#d84060"/>
  </svg>

  <p class="title">Para el amor de mi vida:</p>

  <div class="message">
    <span class="typewriter-line tw1">Sos la persona más cariñosa, amable,</span>
    <span class="typewriter-line tw2" style="margin-top:2px">leal, inteligente y hermosa que pude</span>
    <span class="typewriter-line tw2" style="animation-delay:4.8s;margin-top:2px">haber conocido. A tu lado me siento</span>
    <span class="typewriter-line tw2" style="animation-delay:6.0s;margin-top:2px">seguro y estar a tu lado es lo único</span>
    <span class="typewriter-line tw2" style="animation-delay:7.2s;margin-top:2px">que quiero.</span>
    <span class="typewriter-line tw3" style="margin-top:8px;animation-delay:8.4s">— Te amo <span id="nickname" style="font-family:'Playfair Display',serif;font-size:17px;font-weight:600;color:#c0674a;font-style:italic;display:inline-block;"></span> 💕</span>
  </div>

  <hr class="divider">
  <p class="counter-label">Mi amor por ti comenzó hace...</p>
  <p class="counter" id="counter">—</p>
</div>

<script>
  const container = document.getElementById('hearts');
  const heartChars = ['♥','❤','💕','💗','💖','💓','💞'];
  const colors = ['#e05a7a','#f07090','#c93060','#f0a040','#e84a72','#d4406a','#f06090'];

  function createHeart() {
    const el = document.createElement('span');
    el.classList.add('floating-heart');
    el.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (14 + Math.random() * 18) + 'px';
    el.style.color = colors[Math.floor(Math.random() * colors.length)];
    const dur = 5 + Math.random() * 7;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = (Math.random() * 4) + 's';
    container.appendChild(el);
    setTimeout(() => el.remove(), (dur + 4) * 1000);
  }

  for (let i = 0; i < 12; i++) createHeart();
  setInterval(createHeart, 700);

  const nicknames = [
    'mi Reyna','mi amor','mi pelirroja','mi princesa',
    'mi colorada','mi vida','mi chica','mi mundo','mi todo'
  ];
  let nickIdx = 0;
  const nickEl = document.getElementById('nickname');

  function rotateNick() {
    nickEl.classList.remove('nick-in');
    nickEl.classList.add('nick-out');
    setTimeout(() => {
      nickIdx = (nickIdx + 1) % nicknames.length;
      nickEl.textContent = nicknames[nickIdx];
      nickEl.classList.remove('nick-out');
      nickEl.classList.add('nick-in');
    }, 320);
  }

  setTimeout(() => {
    nickEl.textContent = nicknames[0];
    nickEl.classList.add('nick-in');
    setInterval(rotateNick, 2000);
  }, 9200);

  let prevSeconds = -1, prevMinutes = -1, prevHours = -1, prevDays = -1;

  function updateCounter() {
    const start = new Date('2023-09-26T00:00:00');
    const now = new Date();
    const diff = now - start;
    const totalSec = Math.floor(diff / 1000);
    const s = totalSec % 60;
    const totalMin = Math.floor(totalSec / 60);
    const m = totalMin % 60;
    const totalHr = Math.floor(totalMin / 60);
    const h = totalHr % 24;
    const d = Math.floor(totalHr / 24);

    function numEl(val, prev, id) {
      return `<span class="num${val !== prev ? ' pulse' : ''}" id="${id}">${val}</span>`;
    }

    document.getElementById('counter').innerHTML =
      `${numEl(d, prevDays, 'nd')} días, ${numEl(h, prevHours, 'nh')} horas, ${numEl(m, prevMinutes, 'nm')} minutos, ${numEl(s, prevSeconds, 'ns')} segundos`;

    prevDays = d; prevHours = h; prevMinutes = m; prevSeconds = s;

    setTimeout(() => {
      ['nd','nh','nm','ns'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('pulse');
      });
    }, 350);
  }

  setTimeout(() => {
    updateCounter();
    setInterval(updateCounter, 1000);
  }, 9600);
</script>
</body>
</html>
